<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" role="img" aria-labelledby="title desc">
  <title id="title">Happy Diwali | GitHub contribution graph fireworks</title>
  <desc id="desc">The words Happy Diwali spelled with glowing contribution squares, beneath colorful fireworks and festive sparklers.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08111f"/>
      <stop offset=".58" stop-color="#101b2c"/>
      <stop offset="1" stop-color="#071a16"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d8ffe7"/>
      <stop offset=".58" stop-color="#83f7b0"/>
      <stop offset="1" stop-color="#55d6ff"/>
    </linearGradient>
    <radialGradient id="greenHaze">
      <stop stop-color="#22c55e" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="contributions" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" rx="2" fill="#123d2a"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="burst" fill="none" stroke-linecap="round">
      <path d="M0-35v-12 M0 35v12 M35 0h12 M-35 0h-12 M25-25l9-9 M-25 25l-9 9 M25 25l9 9 M-25-25l-9-9" stroke="currentColor" stroke-width="3"/>
      <circle r="4" fill="currentColor" stroke="none"/>
      <circle cx="0" cy="-49" r="3" fill="currentColor" stroke="none"/>
      <circle cx="0" cy="49" r="3" fill="currentColor" stroke="none"/>
      <circle cx="49" cy="0" r="3" fill="currentColor" stroke="none"/>
      <circle cx="-49" cy="0" r="3" fill="currentColor" stroke="none"/>
      <circle cx="35" cy="-35" r="2.5" fill="currentColor" stroke="none"/>
      <circle cx="-35" cy="35" r="2.5" fill="currentColor" stroke="none"/>
      <circle cx="35" cy="35" r="2.5" fill="currentColor" stroke="none"/>
      <circle cx="-35" cy="-35" r="2.5" fill="currentColor" stroke="none"/>
    </g>
    <g id="glyphH">
      <rect x="0" y="0" width="7" height="47" rx="2"/>
      <rect x="20" y="0" width="7" height="47" rx="2"/>
      <rect x="10" y="20" width="7" height="7" rx="2"/>
    </g>
    <g id="glyphA">
      <rect x="0" y="0" width="27" height="7" rx="2"/>
      <rect x="0" y="10" width="7" height="37" rx="2"/>
      <rect x="20" y="10" width="7" height="37" rx="2"/>
      <rect x="10" y="20" width="7" height="7" rx="2"/>
    </g>
    <g id="glyphP">
      <rect x="0" y="0" width="7" height="47" rx="2"/>
      <rect x="10" y="0" width="17" height="7" rx="2"/>
      <rect x="20" y="10" width="7" height="17" rx="2"/>
      <rect x="10" y="20" width="17" height="7" rx="2"/>
    </g>
    <g id="glyphY">
      <rect x="0" y="0" width="7" height="17" rx="2"/>
      <rect x="20" y="0" width="7" height="17" rx="2"/>
      <rect x="10" y="10" width="7" height="37" rx="2"/>
    </g>
    <g id="glyphD">
      <rect x="0" y="0" width="7" height="47" rx="2"/>
      <rect x="10" y="0" width="7" height="7" rx="2"/>
      <rect x="20" y="10" width="7" height="27" rx="2"/>
      <rect x="10" y="40" width="7" height="7" rx="2"/>
    </g>
    <g id="glyphI">
      <rect x="0" y="0" width="27" height="7" rx="2"/>
      <rect x="0" y="40" width="27" height="7" rx="2"/>
      <rect x="10" y="10" width="7" height="27" rx="2"/>
    </g>
    <g id="glyphW">
      <rect x="0" y="0" width="7" height="37" rx="2"/>
      <rect x="20" y="0" width="7" height="37" rx="2"/>
      <rect x="10" y="20" width="7" height="27" rx="2"/>
      <rect x="0" y="40" width="7" height="7" rx="2"/>
      <rect x="20" y="40" width="7" height="7" rx="2"/>
    </g>
    <g id="glyphL">
      <rect x="0" y="0" width="7" height="47" rx="2"/>
      <rect x="0" y="40" width="27" height="7" rx="2"/>
    </g>
  </defs>

  <rect width="1180" height="340" rx="22" fill="url(#night)"/>
  <ellipse cx="350" cy="300" rx="450" ry="180" fill="url(#greenHaze)"/>
  <rect x="1" y="1" width="1178" height="338" rx="21" fill="none" stroke="#4ade80" stroke-opacity=".28"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="66" y="55" fill="#8da3b8" font-size="12" letter-spacing="2">GITHUB CONTRIBUTIONS · CELEBRATION MODE</text>
    <text x="64" y="94" fill="url(#headline)" font-size="30" font-weight="700" letter-spacing=".5">COMMIT AFTER COMMIT,</text>
    <text x="65" y="119" fill="#c6d5e4" font-size="14">a year of building deserves a little sparkle.</text>

    <rect x="65" y="143" width="514" height="134" rx="8" fill="#0a1421" fill-opacity=".72" stroke="#a8bacb" stroke-opacity=".12"/>
    <rect x="77" y="155" width="494" height="114" fill="url(#contributions)"/>

    <g fill="#0e4429" opacity="0">
      <rect x="77" y="155" width="13" height="13" rx="3"/><rect x="115" y="155" width="13" height="13" rx="3"/><rect x="191" y="155" width="13" height="13" rx="3"/><rect x="248" y="155" width="13" height="13" rx="3"/><rect x="343" y="155" width="13" height="13" rx="3"/><rect x="400" y="155" width="13" height="13" rx="3"/><rect x="476" y="155" width="13" height="13" rx="3"/><rect x="552" y="155" width="13" height="13" rx="3"/>
      <rect x="96" y="174" width="13" height="13" rx="3"/><rect x="153" y="174" width="13" height="13" rx="3"/><rect x="229" y="174" width="13" height="13" rx="3"/><rect x="286" y="174" width="13" height="13" rx="3"/><rect x="381" y="174" width="13" height="13" rx="3"/><rect x="457" y="174" width="13" height="13" rx="3"/><rect x="533" y="174" width="13" height="13" rx="3"/>
      <rect x="77" y="193" width="13" height="13" rx="3"/><rect x="134" y="193" width="13" height="13" rx="3"/><rect x="191" y="193" width="13" height="13" rx="3"/><rect x="267" y="193" width="13" height="13" rx="3"/><rect x="324" y="193" width="13" height="13" rx="3"/><rect x="419" y="193" width="13" height="13" rx="3"/><rect x="495" y="193" width="13" height="13" rx="3"/><rect x="552" y="193" width="13" height="13" rx="3"/>
      <rect x="115" y="212" width="13" height="13" rx="3"/><rect x="172" y="212" width="13" height="13" rx="3"/><rect x="248" y="212" width="13" height="13" rx="3"/><rect x="305" y="212" width="13" height="13" rx="3"/><rect x="362" y="212" width="13" height="13" rx="3"/><rect x="438" y="212" width="13" height="13" rx="3"/><rect x="514" y="212" width="13" height="13" rx="3"/>
      <rect x="77" y="231" width="13" height="13" rx="3"/><rect x="153" y="231" width="13" height="13" rx="3"/><rect x="210" y="231" width="13" height="13" rx="3"/><rect x="286" y="231" width="13" height="13" rx="3"/><rect x="343" y="231" width="13" height="13" rx="3"/><rect x="400" y="231" width="13" height="13" rx="3"/><rect x="476" y="231" width="13" height="13" rx="3"/><rect x="533" y="231" width="13" height="13" rx="3"/>
      <rect x="96" y="250" width="13" height="13" rx="3"/><rect x="172" y="250" width="13" height="13" rx="3"/><rect x="229" y="250" width="13" height="13" rx="3"/><rect x="305" y="250" width="13" height="13" rx="3"/><rect x="381" y="250" width="13" height="13" rx="3"/><rect x="457" y="250" width="13" height="13" rx="3"/><rect x="514" y="250" width="13" height="13" rx="3"/>
    </g>
    <g fill="#26a641" opacity="0">
      <rect x="134" y="155" width="13" height="13" rx="3"/><rect x="305" y="155" width="13" height="13" rx="3"/><rect x="438" y="155" width="13" height="13" rx="3"/>
      <rect x="77" y="174" width="13" height="13" rx="3"/><rect x="210" y="174" width="13" height="13" rx="3"/><rect x="343" y="174" width="13" height="13" rx="3"/><rect x="495" y="174" width="13" height="13" rx="3"/>
      <rect x="96" y="193" width="13" height="13" rx="3"/><rect x="229" y="193" width="13" height="13" rx="3"/><rect x="381" y="193" width="13" height="13" rx="3"/><rect x="533" y="193" width="13" height="13" rx="3"/>
      <rect x="77" y="212" width="13" height="13" rx="3"/><rect x="210" y="212" width="13" height="13" rx="3"/><rect x="324" y="212" width="13" height="13" rx="3"/><rect x="476" y="212" width="13" height="13" rx="3"/>
      <rect x="134" y="231" width="13" height="13" rx="3"/><rect x="248" y="231" width="13" height="13" rx="3"/><rect x="419" y="231" width="13" height="13" rx="3"/><rect x="552" y="231" width="13" height="13" rx="3"/>
      <rect x="115" y="250" width="13" height="13" rx="3"/><rect x="267" y="250" width="13" height="13" rx="3"/><rect x="343" y="250" width="13" height="13" rx="3"/><rect x="495" y="250" width="13" height="13" rx="3"/>
    </g>
    <g fill="#39d353" filter="url(#glow)" opacity="0">
      <rect x="172" y="155" width="13" height="13" rx="3"/><rect x="286" y="174" width="13" height="13" rx="3"/><rect x="362" y="193" width="13" height="13" rx="3"/><rect x="191" y="212" width="13" height="13" rx="3"/><rect x="457" y="231" width="13" height="13" rx="3"/>
      <rect x="400" y="155" width="13" height="13" rx="3"><animate attributeName="opacity" values=".65;1;.65" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="305" y="231" width="13" height="13" rx="3"><animate attributeName="opacity" values=".55;1;.55" dur="2.8s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#8bffad" filter="url(#glow)" opacity="0">
      <rect x="248" y="193" width="13" height="13" rx="3"/><rect x="438" y="212" width="13" height="13" rx="3"/>
    </g>
    <g fill="#39d353" filter="url(#glow)" transform="translate(90 188)">
      <use href="#glyphH" x="0"/>
      <use href="#glyphA" x="40"/>
      <use href="#glyphP" x="80"/>
      <use href="#glyphP" x="120"/>
      <use href="#glyphY" x="160"/>
      <use href="#glyphD" x="212"/>
      <use href="#glyphI" x="252"/>
      <use href="#glyphW" x="292"/>
      <use href="#glyphA" x="332"/>
      <use href="#glyphL" x="372"/>
      <use href="#glyphI" x="412"/>
