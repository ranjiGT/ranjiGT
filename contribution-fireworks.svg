    <g fill="#8bffad" filter="url(#glow)">
      <rect x="183" y="188" width="7" height="7" rx="2"><animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="443" y="228" width="7" height="7" rx="2"><animate attributeName="opacity" values=".45;1;.45" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="523" y="198" width="7" height="7" rx="2"><animate attributeName="opacity" values=".5;1;.5" dur="2.1s" repeatCount="indefinite"/></rect>
    </g>

    <text x="66" y="309" fill="#a6b8ca" font-size="12">Every square tells a story. Tonight, they shine.</text>
    <text x="566" y="309" fill="#8bffad" font-size="11" text-anchor="end">LESS  ▪ ▪ ▪ ▪  MORE</text>
  </g>

  <g filter="url(#glow)" color="#ffcc66" transform="translate(735 123)">
    <use href="#burst">
      <animateTransform attributeName="transform" type="scale" values=".55;.95;.7" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.55" dur="2.8s" repeatCount="indefinite"/>
    </use>
  </g>
  <g filter="url(#glow)" color="#ff78b7" transform="translate(933 95) scale(.72)">
    <use href="#burst">
      <animateTransform attributeName="transform" type="scale" values=".6;1;.75" dur="3.2s" begin=".6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.5" dur="3.2s" begin=".6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g filter="url(#glow)" color="#64ddff" transform="translate(1065 188) scale(.54)">
    <use href="#burst">
      <animateTransform attributeName="transform" type="scale" values=".55;1;.7" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".35;1;.55" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    </use>
  </g>

  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M681 235q42-56 84-10" stroke="#ffcc66" stroke-width="2" stroke-dasharray="2 8">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M806 209q30-42 57-4" stroke="#ff78b7" stroke-width="2" stroke-dasharray="2 7">
      <animate attributeName="stroke-dashoffset" values="0;-27" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M980 247q25-35 51-4" stroke="#64ddff" stroke-width="2" stroke-dasharray="2 7">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(858 276)">
    <path d="M0 10h106l-8 22H8z" fill="#c73d62" stroke="#ff9a76" stroke-width="2"/>
    <path d="M14 11l8 20m14-20l8 20m14-20l8 20m14-20l8 20" stroke="#ffd166" stroke-width="5"/>
    <path d="M0 10l-18-9m124 9l18-9" fill="none" stroke="#ffcc66" stroke-width="2" stroke-dasharray="2 5"/>
    <circle cx="-19" cy="1" r="3" fill="#fff1a8" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.3;1" dur=".7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="143" cy="1" r="3" fill="#fff1a8" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur=".9s" repeatCount="indefinite"/>
    </circle>
    <path d="M43 32v10" stroke="#ff9a76" stroke-width="3"/>
